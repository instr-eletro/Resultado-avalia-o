<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabarito & Solucionador de Avaliações | Fundamentos de Sistemas Elétricos</title>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="container">
    <!-- Header Principal -->
    <header class="app-header glass-panel">
      <div class="header-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Curso Técnico em Eletrotécnica
      </div>
      <h1 class="header-title">Solucionador & Gabarito de Avaliações Técnicas</h1>
      <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 1.25rem;">
        Unidade Curricular: <strong>Fundamentos de Sistemas Elétricos</strong> — Contexto Industrial: Indústria de Alimentos
      </p>
      <div class="header-meta">
        <div class="meta-item">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
          <span>Turma: <strong>1055016</strong></span>
        </div>
        <div class="meta-item">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="18" y2="10"/></svg>
          <span>Data de Aplicação: <strong>30/10/2026</strong></span>
        </div>
      </div>
    </header>

    <!-- Barra de Busca por Número da Avaliação -->
    <section class="search-section glass-panel no-print">
      <div class="search-title">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        Consultar Gabarito pelo Número da Avaliação / Aluno
      </div>
      <div class="search-controls">
        <div class="input-group">
          <span class="search-icon">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"/></svg>
          </span>
          <input type="number" id="input-numero" class="input-number" placeholder="Digite o nº da avaliação (ex: 1 a 36)" min="1" max="36" value="15">
        </div>
        
        <button id="btn-buscar" class="btn btn-primary">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          Ver Respostas
        </button>

        <select id="select-aluno" class="quick-select">
          <option value="">Selecione a Avaliação...</option>
        </select>

        <div style="display: flex; gap: 0.5rem;">
          <button id="btn-anterior" class="btn btn-secondary" title="Avaliação Anterior">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
          </button>
          <button id="btn-proximo" class="btn btn-secondary" title="Próxima Avaliação">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Container Dinâmico onde serão injetadas as respostas detalhadas -->
    <main id="resultado-container">
      <!-- Injetado via script.js -->
    </main>
  </div>

  <!-- Scripts -->
  <script src="dados_alunos.js"></script>
  <script src="script.js"></script>
</body>
</html>
